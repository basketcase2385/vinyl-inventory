<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e63946">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>Vinyl Inventory</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #121212;
      --bg-panel:   #1c1c1c;
      --bg-card:    #242424;
      --bg-input:   #1a1a1a;
      --border:     #333;
      --border-lit: #4a4a4a;
      --accent:     #e63946;
      --accent-dim: #8b2128;
      --text:       #e0e0e0;
      --text-dim:   #888;
      --text-bright:#ffffff;
      --green:      #4caf50;
      --yellow:     #ffc107;
      --radius:     10px;
      --tab-h:      60px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100dvh; }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.05em; color: var(--text-bright); }
    #record-count {
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      min-width: 28px;
      text-align: center;
    }

    #panels {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 12px 12px calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 12px);
      display: none;
    }
    .panel.active { display: block; }

    /* ── Tab bar ─────────────────────────────────────────────── */
    #tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      z-index: 100;
    }
    .tab-btn {
      flex: 1;
      height: var(--tab-h);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .tab-btn.active { color: var(--accent); }

    /* ── Cards / list ────────────────────────────────────────── */
    .record-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .record-card:active { border-color: var(--accent); }

    .cover-thumb {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--border);
      flex-shrink: 0;
    }
    .cover-placeholder {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      background: var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cover-placeholder svg { width: 28px; height: 28px; opacity: 0.4; }

    .card-info { flex: 1; min-width: 0; }
    .card-artist { font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-title  { font-size: 15px; font-weight: 600; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta   { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    /* ── Search bar ──────────────────────────────────────────── */
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .search-row input {
      flex: 1;
    }
    select, input[type="text"], input[type="number"], input[type="search"] {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 12px;
      outline: none;
      width: 100%;
      -webkit-appearance: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    select { cursor: pointer; }

    .sort-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .sort-row select { flex: 1; font-size: 13px; padding: 8px 10px; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 18px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; font-size: 16px; padding: 14px; border-radius: var(--radius); }
    .btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; }
    .btn-sm { font-size: 13px; padding: 8px 14px; }
    .btn-spotify { background: #1DB954; color: #000; border: none; font-weight: 600; gap: 8px; text-decoration: none; }
    .btn-spotify svg { flex-shrink: 0; }

    /* ── Lock / PIN modal ────────────────────────────────────── */
    .lock-btn { background: none; border: none; cursor: pointer; color: var(--text-dim); padding: 6px; line-height: 0; flex-shrink: 0; }
    .lock-btn:active { color: var(--text); }
    #pin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 200; }
    #pin-modal.open { display: flex; }
    .pin-box { background: var(--bg-card); border-radius: var(--radius); padding: 24px; width: 280px; display: flex; flex-direction: column; gap: 12px; }
    .pin-box h3 { margin: 0; font-size: 16px; color: var(--text-bright); text-align: center; }
    .pin-box input { letter-spacing: 4px; font-size: 22px; text-align: center; }
    .pin-error { color: #ff6b6b; font-size: 13px; text-align: center; min-height: 18px; }

    /* ── Segmented control ───────────────────────────────────── */
    .seg-ctrl {
      display: flex;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .seg-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 10px 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .seg-btn.active { background: var(--accent); color: #fff; }

    /* ── Form ────────────────────────────────────────────────── */
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 12px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.05em; margin-bottom: 5px; display: block; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }
    .input-greyed { opacity: 0.5; pointer-events: none; }
    .required-star { color: var(--accent); }

    input.error { border-color: var(--accent) !important; }

    /* ── Result picker ───────────────────────────────────────── */
    .results-list { margin-bottom: 14px; }
    .result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .result-item:active { border-color: var(--accent); }
    .result-thumb {
      width: 48px;
      height: 48px;
      border-radius: 5px;
      object-fit: cover;
      background: var(--border);
      flex-shrink: 0;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-title  { font-size: 14px; font-weight: 600; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-artist { font-size: 12px; color: var(--text-dim); }
    .result-meta   { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

    /* ── Live camera viewfinder ──────────────────────────────── */
    .camera-wrap {
      position: relative;
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      margin-bottom: 12px;
      aspect-ratio: 4/3;
      display: none;
    }
    .camera-wrap.active { display: block; }
    .camera-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* ── Quagga2 viewport ──────────────────────────────────────────── */
    #quagga-viewport {
      position: absolute;
      inset: 0;
      display: none;
    }
    #quagga-viewport.active { display: block; }
    /* Make Quagga's injected <video> and <canvas> fill the container */
    #quagga-viewport video,
    #quagga-viewport canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
    /* Hide Quagga's debug drawing canvas — we have our own overlay */
    #quagga-viewport canvas.drawingBuffer { display: none !important; }

    /* barcode overlay guides */
    .scan-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .scan-frame {
      width: 72%;
      height: 28%;
      border: 2px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
    }
    /* shutter button */
    .shutter-btn {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid rgba(255,255,255,0.5);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shutter-btn::after {
      content: '';
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #ccc;
    }
    .shutter-btn:active { opacity: 0.75; }

    /* ── Photo preview ───────────────────────────────────────── */
    #photo-preview {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: var(--radius);
      background: #000;
      margin-bottom: 12px;
      display: none;
    }

    /* ── Detail sheet ────────────────────────────────────────── */
    #detail-sheet {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    #detail-sheet.open { transform: translateY(0); }

    #detail-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
    }
    #detail-inner {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 92dvh;
      background: var(--bg-panel);
      border-radius: 16px 16px 0 0;
      overflow-y: auto;
      padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
    }
    #detail-handle {
      width: 36px;
      height: 4px;
      background: var(--border-lit);
      border-radius: 2px;
      margin: 10px auto 16px;
    }
    #detail-cover {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: #000;
      display: none;
    }
    .detail-body { padding: 0 16px; }
    .detail-title  { font-size: 20px; font-weight: 700; color: var(--text-bright); margin-bottom: 2px; }
    .detail-artist { font-size: 15px; color: var(--accent); margin-bottom: 14px; }
    .detail-field  { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .detail-field:last-of-type { border-bottom: none; }
    .detail-key    { font-size: 13px; color: var(--text-dim); flex-shrink: 0; }
    .detail-val    { font-size: 13px; color: var(--text-bright); text-align: right; word-break: break-word; }
    .detail-actions { display: flex; gap: 8px; margin-top: 16px; padding: 0 16px; }
    #detail-view-actions { flex-direction: column; align-items: stretch; }

    /* ── Edit form in detail ─────────────────────────────────── */
    #edit-form { padding: 0 16px; display: none; }
    #edit-form .form-group { margin-bottom: 10px; }

    /* ── Spinner / loading ───────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-msg {
      text-align: center;
      color: var(--text-dim);
      padding: 24px;
      font-size: 14px;
    }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--green);
      color: #fff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      transition: transform 0.25s ease;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }
    #toast.error { background: var(--accent); }
    #toast.show  { transform: translateX(-50%) translateY(0); }

    /* ── Empty state ─────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-dim);
    }
    .empty-state svg { width: 56px; height: 56px; opacity: 0.3; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* ── Misc ────────────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    hr.divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>&#9679; VINYL</h1>
    <span id="record-count">0</span>
  </header>

  <div id="panels">
    <!-- ── BROWSE ──────────────────────────────────────────── -->
    <div id="panel-browse" class="panel active">
      <div class="search-row">
        <input type="search" id="search-input" placeholder="Search artist, title, label…" autocomplete="off" oninput="debouncedLoad()">
        <button class="lock-btn" id="lock-btn" onclick="toggleLock()" style="display:none">
          <svg id="lock-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path id="lock-shackle" d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>
      </div>
      <div class="sort-row">
        <select id="sort-select" onchange="loadRecords()">
          <option value="date_added">Recently Added</option>
          <option value="artist">Artist A–Z</option>
          <option value="title">Title A–Z</option>
          <option value="year">Year</option>
        </select>
        <select id="order-select" onchange="loadRecords()">
          <option value="desc">↓ Desc</option>
          <option value="asc">↑ Asc</option>
        </select>
      </div>
      <div id="record-list"></div>
    </div>

    <!-- ── ADD ────────────────────────────────────────────── -->
    <div id="panel-add" class="panel">
      <div class="seg-ctrl">
        <button class="seg-btn active" onclick="setScanMode('scan')">SCAN</button>
        <button class="seg-btn" onclick="setScanMode('photo')">PHOTO</button>
        <button class="seg-btn" onclick="setScanMode('search')">SEARCH</button>
        <button class="seg-btn" onclick="setScanMode('manual')">MANUAL</button>
      </div>

      <!-- Scan mode -->
      <div id="mode-scan">
        <div class="section-label">Point camera at barcode</div>
        <!-- Live camera viewfinder -->
        <div class="camera-wrap" id="scan-camera-wrap">
          <!-- BarcodeDetector path -->
          <video id="scan-video" autoplay playsinline muted></video>
          <!-- Quagga2 path: library injects its own <video>+<canvas> here -->
          <div id="quagga-viewport"></div>
          <div class="scan-overlay"><div class="scan-frame"></div></div>
        </div>
        <!-- Fallback file input for devices without getUserMedia -->
        <label class="btn btn-secondary" id="scan-file-btn" style="width:100%;margin-bottom:12px;cursor:pointer;display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h2v2H7zM15 7h2v2h-2zM7 15h2v2H7zM11 11h2v2h-2zM15 15h2v2h-2z"/></svg>
          Upload Barcode Photo
          <input type="file" id="scan-input" accept="image/*" capture="environment" style="display:none" onchange="handleScanPhoto(this)">
        </label>
        <div id="scan-status" class="loading-msg" style="display:none"></div>
      </div>

      <!-- Photo mode -->
      <div id="mode-photo" style="display:none">
        <div class="section-label">Point camera at sleeve or label</div>
        <!-- Live camera viewfinder -->
        <div class="camera-wrap" id="photo-camera-wrap">
          <video id="photo-video" autoplay playsinline muted></video>
          <button class="shutter-btn" onclick="capturePhoto()" aria-label="Capture"></button>
        </div>
        <!-- Fallback file input -->
        <label class="btn btn-secondary" id="photo-file-btn" style="width:100%;margin-bottom:12px;cursor:pointer;display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Upload Sleeve Photo
          <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoSelected(this)">
        </label>
        <img id="photo-preview" alt="Preview">
        <div id="photo-status" class="loading-msg" style="display:none"></div>
      </div>

      <!-- Search mode -->
      <div id="mode-search" style="display:none">
        <div class="section-label">Search Discogs</div>
        <div class="search-row" style="margin-bottom:12px">
          <input type="text" id="discogs-search-input" placeholder="Artist, album name…" autocomplete="off">
          <button class="btn btn-secondary btn-sm" onclick="runDiscogsSearch()">Search</button>
        </div>
        <div id="discogs-status" class="loading-msg" style="display:none"></div>
      </div>

      <!-- Shared: Discogs results picker -->
      <div id="discogs-results" class="results-list" style="display:none">
        <div class="section-label">Select a release</div>
        <div id="discogs-results-inner"></div>
      </div>

      <!-- Shared: Add form -->
      <div id="add-form-wrap" style="display:none">
        <hr class="divider">
        <div class="section-label">Record details</div>
        <div class="form-group">
          <label class="form-label">ARTIST <span class="required-star">*</span></label>
          <input type="text" id="f-artist" placeholder="e.g. Miles Davis" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">TITLE <span class="required-star">*</span></label>
          <input type="text" id="f-title" placeholder="e.g. Kind of Blue" autocomplete="off">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">YEAR</label>
            <input type="number" id="f-year" placeholder="1959" min="1900" max="2099">
          </div>
          <div class="form-group">
            <label class="form-label">FORMAT</label>
            <select id="f-format">
              <option value="">—</option>
              <option value="LP">LP</option>
              <option value="EP">EP</option>
              <option value="7&quot;">7"</option>
              <option value="10&quot;">10"</option>
              <option value="12&quot;">12"</option>
              <option value="2xLP">2xLP</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">LABEL</label>
          <input type="text" id="f-label" placeholder="e.g. Columbia" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">CATALOG NO.</label>
          <input type="text" id="f-catalog" placeholder="e.g. CS 8163" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">GENRES / TAGS</label>
          <input type="text" id="f-genres" placeholder="e.g. Jazz, Modal" autocomplete="off">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">PAID (£/$)</label>
            <input type="number" id="f-purchase-price" placeholder="0.00" step="0.01" min="0">
          </div>
          <div class="form-group">
            <label class="form-label">VALUE (£/$)</label>
            <input type="number" id="f-market-value" placeholder="0.00" step="0.01" min="0">
          </div>
        </div>
        <div class="form-group">

<!-- ── Toast ───────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- Quagga2 barcode library (served locally from Pi) -->
<script src="/static/quagga.min.js"></script>

<script>
// ── State ──────────────────────────────────────────────────────────────
let currentTab    = 'browse';
let scanMode      = 'scan';
let records       = [];
let currentRecord = null;
let photoBlob     = null;

// Auth
let isOwner     = false;
let authEnabled = false;
let ownerToken  = null;

// Camera state
let scanStream   = null;   // MediaStream for barcode scanner
let photoStream  = null;   // MediaStream for photo capture
let scanInterval  = null;   // decode loop handle (BarcodeDetector path)
let quaggaActive  = false;  // true while Quagga2 is running

// ── Init ───────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initAuth();
  loadRecords();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => reg.update())
      .catch(() => {});
  }
  document.getElementById('pin-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitPin();
  });
});

// ── Auth ───────────────────────────────────────────────────────────────
async function initAuth() {
  try {
    const resp = await fetch('/api/auth/status');
    const data = await resp.json();
    authEnabled = data.auth_enabled;
  } catch (_) {}

  if (!authEnabled) {
    setOwner(true);
    return;
  }

  document.getElementById('lock-btn').style.display = '';

  const saved = JSON.parse(localStorage.getItem('ownerSession') || 'null');
  if (saved && saved.expiry > Date.now()) {
    ownerToken = saved.token;
    setOwner(true);
  } else {
    setOwner(false);
  }
}

function setOwner(val) {
  isOwner = val;
  document.getElementById('tab-add').style.display       = val ? '' : 'none';
  document.getElementById('owner-actions').style.display = val ? 'flex' : 'none';
  updateLockIcon();
}

function updateLockIcon() {
  const shackle = document.getElementById('lock-shackle');
  if (!shackle) return;
  // Open shackle when owner (unlocked), closed when visitor (locked)
  shackle.setAttribute('d', isOwner
    ? 'M7 11V7a5 5 0 0 1 9.9-1'   // open padlock
    : 'M7 11V7a5 5 0 0 1 10 0v4'  // closed padlock
  );
}

function toggleLock() {
  if (!authEnabled) return;
  if (isOwner) {
    fetch('/api/auth/logout', { method: 'POST', headers: authHeaders() });
    ownerToken = null;
    localStorage.removeItem('ownerSession');
    setOwner(false);
  } else {
    openPinModal();
  }
}

function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (ownerToken) h['Authorization'] = 'Bearer ' + ownerToken;
  return h;
}

function openPinModal() {
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-error').textContent = '';
  document.getElementById('pin-modal').classList.add('open');
  setTimeout(() => document.getElementById('pin-input').focus(), 50);
}

function closePinModal() {
  document.getElementById('pin-modal').classList.remove('open');
}

async function submitPin() {
  const pin = document.getElementById('pin-input').value;
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin }),
    });
    const data = await resp.json();
    if (data.token) {
      ownerToken = data.token;
      localStorage.setItem('ownerSession', JSON.stringify({
        token: ownerToken, expiry: Date.now() + 86400000,
      }));
      setOwner(true);
      closePinModal();
    } else {
      document.getElementById('pin-error').textContent = 'Wrong PIN';
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-input').focus();
    }
  } catch (_) {
    document.getElementById('pin-error').textContent = 'Error — try again';
  }
}

// ── Tabs ───────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  currentTab = name;

  if (name === 'browse') {
    stopAllCameras();
    loadRecords();
  }
}

// ── Browse / Search ────────────────────────────────────────────────────
const debouncedLoad = debounce(loadRecords, 350);

async function loadRecords() {
  const q     = document.getElementById('search-input').value.trim();
  const sort  = document.getElementById('sort-select').value;
  const order = document.getElementById('order-select').value;

  const params = new URLSearchParams({ sort, order });
  if (q) params.set('q', q);

  try {
    const resp = await fetch('/api/records?' + params);
    records = await resp.json();
    renderList();
    document.getElementById('record-count').textContent = records.length;
  } catch (e) {
    showToast('Failed to load records', 'error');
  }
}

function renderList() {
  const el = document.getElementById('record-list');
  if (!records.length) {
    el.innerHTML = `<div class="empty-state">
      ${recordIcon(48)}
      <p>No records yet.<br>Tap ADD to start your inventory.</p>
    </div>`;
    return;
  }
  el.innerHTML = records.map(r => `
    <div class="record-card" onclick="openDetail(${r.id})">
      ${coverThumb(r.cover_url)}
      <div class="card-info">
        <div class="card-artist">${esc(r.artist)}</div>
        <div class="card-title">${esc(r.title)}</div>
        <div class="card-meta">${[r.year, r.format, r.label].filter(Boolean).join(' · ')}</div>
      </div>
    </div>
  `).join('');
}

function coverThumb(url) {
  if (!url) return `<div class="cover-placeholder">${recordIcon(28)}</div>`;
  return `<img class="cover-thumb" src="${esc(url)}" alt="" onerror='handleCoverError(this)'>`;
}

function handleCoverError(img) {
  const ph = document.createElement('div');
  ph.className = 'cover-placeholder';
  ph.innerHTML = recordIcon(28);
  img.replaceWith(ph);
}

function recordIcon(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="#333"/>
    <circle cx="50" cy="50" r="28" fill="none" stroke="#555" stroke-width="3"/>
    <circle cx="50" cy="50" r="8" fill="#e63946"/>
    <circle cx="50" cy="50" r="2.5" fill="#121212"/>
  </svg>`;
}

// ── Detail sheet ───────────────────────────────────────────────────────
async function openDetail(id) {
  try {
    const resp = await fetch('/api/records/' + id);
    currentRecord = await resp.json();
  } catch (e) {
    showToast('Could not load record', 'error');
    return;
  }

  const r = currentRecord;
  document.getElementById('detail-title').textContent  = r.title;
  document.getElementById('detail-artist').textContent = r.artist;

  const cover = document.getElementById('detail-cover');
  if (r.cover_url) {
    cover.src = r.cover_url;
    cover.style.display = 'block';
    cover.onerror = () => { cover.style.display = 'none'; };
  } else {
    cover.style.display = 'none';
  }

  const fields = [
    ['Year',       r.year],
    ['Format',     r.format],
    ['Label',      r.label],
    ['Catalog No.',r.catalog_number],
    ['Genres',     r.genres],
    ['Paid',       r.purchase_price != null ? formatCurrency(r.purchase_price) : null],
    ['Value',      r.market_value   != null ? formatCurrency(r.market_value)   : null],
    ['Average Sell', r.average_sell_price != null ? formatCurrency(r.average_sell_price) : '—'],
    ['Added',      r.date_added],
    ['Discogs ID', r.discogs_id],
  ];

  document.getElementById('detail-fields').innerHTML = fields
    .filter(([, v]) => v != null && v !== '')
    .map(([k, v]) => `<div class="detail-field"><span class="detail-key">${k}</span><span class="detail-val">${esc(String(v))}</span></div>`)
    .join('');

  const spotifyBtn  = document.getElementById('detail-spotify-btn');
  const spotifyFind = document.getElementById('detail-spotify-find');
  if (r.spotify_url) {
    spotifyBtn.href = r.spotify_url;
    spotifyBtn.style.display = '';
    spotifyFind.style.display = 'none';
  } else {
    spotifyBtn.style.display = 'none';
    spotifyFind.style.display = '';
  }

  document.querySelector('.detail-body').style.display = '';
  document.getElementById('edit-form').style.display = 'none';
  document.getElementById('detail-view-actions').style.display = '';

  document.getElementById('detail-sheet').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-sheet').classList.remove('open');
  currentRecord = null;
}

async function findSpotify() {
  const btn = document.getElementById('detail-spotify-find');
  btn.textContent = 'Searching…';
  btn.disabled = true;
  try {
    const resp = await fetch(`/api/records/${currentRecord.id}/spotify`, { method: 'POST', headers: authHeaders() });
    const data = await resp.json();
    if (data.spotify_url) {
      currentRecord.spotify_url = data.spotify_url;
      const listenBtn = document.getElementById('detail-spotify-btn');
      listenBtn.href = data.spotify_url;
      listenBtn.style.display = '';
      btn.style.display = 'none';
      window.open(data.spotify_url, '_blank');
    } else {
      showToast('Not found on Spotify', 'error');
      btn.textContent = 'Find on Spotify';
      btn.disabled = false;
    }
  } catch (e) {
    showToast('Spotify lookup failed', 'error');
    btn.textContent = 'Find on Spotify';
    btn.disabled = false;
  }
}

function startEdit() {
  const r = currentRecord;
  document.getElementById('e-artist').value         = r.artist || '';
  document.getElementById('e-title').value          = r.title  || '';
  document.getElementById('e-year').value           = r.year   || '';
  document.getElementById('e-format').value         = r.format || '';
  document.getElementById('e-label').value          = r.label  || '';
  document.getElementById('e-catalog').value        = r.catalog_number || '';
  document.getElementById('e-genres').value         = r.genres || '';
  document.getElementById('e-purchase-price').value = r.purchase_price != null ? r.purchase_price : '';
  document.getElementById('e-market-value').value   = r.market_value   != null ? r.market_value   : '';
  document.getElementById('e-average-sell-price').value = r.average_sell_price != null ? r.average_sell_price : '';
  document.getElementById('e-cover-url').value      = r.cover_url || '';

  document.getElementById('detail-cover').style.display = 'none';
  document.querySelector('.detail-body').style.display = 'none';
  document.getElementById('edit-form').style.display = 'block';
  document.getElementById('detail-inner').scrollTop = 0;
}

function cancelEdit() {
  const cover = document.getElementById('detail-cover');
  cover.style.display = (currentRecord && currentRecord.cover_url) ? 'block' : 'none';
  document.querySelector('.detail-body').style.display = '';
  document.getElementById('edit-form').style.display = 'none';
}

async function saveEdit() {
  const artist = document.getElementById('e-artist').value.trim();
  const title  = document.getElementById('e-title').value.trim();
  if (!artist || !title) { showToast('Artist and title are required', 'error'); return; }

  const payload = {
    artist,
    title,
    year:           parseIntOrNull(document.getElementById('e-year').value),
    format:         document.getElementById('e-format').value,
    label:          document.getElementById('e-label').value.trim(),
    catalog_number: document.getElementById('e-catalog').value.trim(),
    genres:         document.getElementById('e-genres').value.trim(),
    purchase_price: parseFloatOrNull(document.getElementById('e-purchase-price').value),
    market_value:   parseFloatOrNull(document.getElementById('e-market-value').value),
    average_sell_price: parseFloatOrNull(document.getElementById('e-average-sell-price').value),
    cover_url:      document.getElementById('e-cover-url').value.trim(),
    discogs_id:     currentRecord.discogs_id,
  };

  try {
    const resp = await fetch('/api/records/' + currentRecord.id, {
      method: 'PUT', headers: authHeaders(), body: JSON.stringify(payload),
    });
    if (!resp.ok) {
      const errMsg = await getApiErrorMessage(resp, `HTTP ${resp.status}`);
      showToast(`Save failed: ${errMsg}`, 'error');
      return;
    }
    showToast('Saved');
    closeDetail();
    loadRecords();
  } catch (e) {
    showToast('Save failed: network error', 'error');
  }
}

async function deleteRecord() {
  if (!confirm(`Delete "${currentRecord.title}"?`)) return;
  try {
    await fetch('/api/records/' + currentRecord.id, { method: 'DELETE', headers: authHeaders() });
    showToast('Deleted');
    closeDetail();
    loadRecords();
  } catch (e) {
    showToast('Delete failed', 'error');
  }
}

// ── Camera helpers ─────────────────────────────────────────────────────
function stopStream(stream) {
  if (stream) stream.getTracks().forEach(t => t.stop());
}

function stopAllCameras() {
  clearInterval(scanInterval);
  scanInterval = null;
  if (quaggaActive) {
    try { Quagga.offDetected(onQuaggaDetected); Quagga.stop(); } catch (_) {}
    quaggaActive = false;
  }
  stopStream(scanStream);  scanStream  = null;
  stopStream(photoStream); photoStream = null;
  document.getElementById('scan-camera-wrap').classList.remove('active');
  document.getElementById('photo-camera-wrap').classList.remove('active');
  document.getElementById('scan-video').srcObject  = null;
  document.getElementById('photo-video').srcObject = null;
  const qv = document.getElementById('quagga-viewport');
  qv.classList.remove('active');
  qv.innerHTML = ''; // remove Quagga's injected <video>/<canvas> elements
}

async function startCamera(videoEl, onStream) {
  // Prefer back/environment camera on mobile
  const constraints = {
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } },
  };
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    videoEl.srcObject = stream;
    await videoEl.play();
    onStream(stream, null);
  } catch (err) {
    onStream(null, err);
  }
}

// ── Add: mode switching ────────────────────────────────────────────────
function setScanMode(mode) {
  stopAllCameras();
  scanMode = mode;

  document.querySelectorAll('.seg-btn').forEach((b, i) => {
    b.classList.toggle('active', ['scan','photo','search','manual'][i] === mode);
  });

  document.getElementById('mode-scan').style.display   = mode === 'scan'   ? '' : 'none';
  document.getElementById('mode-photo').style.display  = mode === 'photo'  ? '' : 'none';
  document.getElementById('mode-search').style.display = mode === 'search' ? '' : 'none';

  document.getElementById('discogs-results').style.display = 'none';
  document.getElementById('add-form-wrap').style.display   = 'none';

  if (mode === 'manual') {
    document.getElementById('add-form-wrap').style.display = '';
    clearAddForm();
  } else if (mode === 'scan') {
    startScanCamera();
  } else if (mode === 'photo') {
    startPhotoCamera();
  } else if (mode === 'search') {
    document.getElementById('discogs-search-input').focus();
  }
}

// ── Live barcode scanning ──────────────────────────────────────────────
function startScanCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    document.getElementById('scan-file-btn').style.display = '';
    setStatus('scan-status', 'Live camera not available — upload a photo instead.');
    return;
  }

  // Path 1: Native BarcodeDetector (Chrome on Android / desktop)
  if ('BarcodeDetector' in window) {
    const wrap  = document.getElementById('scan-camera-wrap');
    const video = document.getElementById('scan-video');
    setStatus('scan-status', '<span class="spinner"></span> Starting camera…');
    startCamera(video, (stream, err) => {
      if (err || !stream) {
        // Camera failed — fall through to Quagga
        startQuaggaScanner();
        return;
      }
      scanStream = stream;
      wrap.classList.add('active');

      let detector = null;
      try {
        detector = new BarcodeDetector({ formats: [
          'ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf'
        ]});
      } catch (_) {
        try { detector = new BarcodeDetector(); } catch (_2) {}
      }

      if (!detector) {
        stopStream(scanStream); scanStream = null;
        wrap.classList.remove('active');
        video.srcObject = null;
        startQuaggaScanner();
        return;
      }

      setStatus('scan-status', 'Ready — hold barcode steady inside the frame.');
      let detecting = false;
      scanInterval = setInterval(async () => {
        if (detecting || video.readyState < 2 || video.videoWidth === 0) return;
        detecting = true;
        try {
          const codes = await detector.detect(video);
          if (codes.length > 0) {
            clearInterval(scanInterval); scanInterval = null;
            stopStream(scanStream); scanStream = null;
            wrap.classList.remove('active');
            await handleBarcode(codes[0].rawValue);
            if (scanMode === 'scan') startScanCamera();
            return;
          }
        } catch (_) {
          // BarcodeDetector threw — give up and use Quagga
          clearInterval(scanInterval); scanInterval = null;
          stopStream(scanStream); scanStream = null;
          wrap.classList.remove('active');
          video.srcObject = null;
          startQuaggaScanner();
          return;
        }
        detecting = false;
      }, 350);
    });
    return;
  }

  // Path 2: Quagga2 (everything else)
  startQuaggaScanner();
}

// Named handler so we can safely remove it with offDetected
async function onQuaggaDetected(result) {
  if (!quaggaActive) return;
  const code = result.codeResult.code;
  if (!code) return;
  quaggaActive = false;
  try { Quagga.offDetected(onQuaggaDetected); Quagga.stop(); } catch (_) {}
  document.getElementById('scan-camera-wrap').classList.remove('active');
  await handleBarcode(code);
  if (scanMode === 'scan') startScanCamera();
}

function startQuaggaScanner() {
  if (typeof Quagga === 'undefined') {
    document.getElementById('scan-file-btn').style.display = '';
    setStatus('scan-status', 'Barcode scanner unavailable — upload a photo instead.');
    return;
  }

  const wrap     = document.getElementById('scan-camera-wrap');
  const viewport = document.getElementById('quagga-viewport');

  // Clear any leftover DOM from a previous Quagga session
  viewport.innerHTML = '';
  viewport.classList.remove('active');

  setStatus('scan-status', '<span class="spinner"></span> Starting barcode scanner…');

  Quagga.init({
    inputStream: {
      type: 'LiveStream',
      target: viewport,          // <div> container, not <video>
      constraints: {
        facingMode: 'environment',
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
    },
    locator: {
      patchSize: 'medium',
      halfSample: false,  // full resolution — required for real-world barcode detection
    },
    numOfWorkers: 0,
    frequency: 10,
    decoder: {
      readers: [
        'ean_reader',      // EAN-13 — most vinyl barcodes
        'ean_8_reader',    // EAN-8
        'upc_reader',      // UPC-A — US releases
        'upc_e_reader',    // UPC-E
        'code_128_reader', // Code 128
      ],
      multiple: false,
    },
    locate: true,
  }, function (err) {
    if (err) {
      document.getElementById('scan-file-btn').style.display = '';
      setStatus('scan-status', 'Scanner error: ' + (err.message || err));
      return;
    }
    quaggaActive = true;
    viewport.classList.add('active');
    wrap.classList.add('active');
    setStatus('scan-status', 'Ready — hold barcode steady inside the frame.');
    Quagga.start();
    Quagga.onDetected(onQuaggaDetected);
  });
}

// Fallback: file-based barcode scan
async function handleScanPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  setStatus('scan-status', '<span class="spinner"></span> Reading barcode…');
  const img = await createImageBitmap(file);
  if ('BarcodeDetector' in window) {
    try {
      const detector = new BarcodeDetector();
      const codes = await detector.detect(img);
      if (codes.length) { await handleBarcode(codes[0].rawValue); return; }
    } catch (_) {}
  }
  setStatus('scan-status', 'No barcode found — try better lighting or use SEARCH mode.');
}

async function handleBarcode(code) {
  setStatus('scan-status', `<span class="spinner"></span> Looking up ${esc(code)}…`);
  try {
    const resp = await fetch('/api/discogs/barcode?code=' + encodeURIComponent(code));
    const data = await resp.json();
    if (resp.status === 429) { setStatus('scan-status', 'Discogs rate limit — wait a minute and try again.'); return; }
    if (!data.results?.length) { setStatus('scan-status', `No results for ${esc(code)}. Try PHOTO or SEARCH.`); return; }
    if (data.results.length === 1) {
      await fillAndSaveFromRelease(data.results[0].discogs_id);
    } else {
      setStatus('scan-status', '');
      showResults(data.results, 'fillAndSaveFromRelease');
    }
  } catch (e) {
    setStatus('scan-status', 'Network error. Check connection.');
  }
}

// ── Live photo capture ─────────────────────────────────────────────────
function startPhotoCamera() {
  const wrap  = document.getElementById('photo-camera-wrap');
  const video = document.getElementById('photo-video');

  if (!navigator.mediaDevices?.getUserMedia) {
    document.getElementById('photo-file-btn').style.display = '';
    setStatus('photo-status', 'Live camera not available — upload a photo instead.');
    return;
  }

  setStatus('photo-status', '<span class="spinner"></span> Starting camera…');

  startCamera(video, (stream, err) => {
    if (err || !stream) {
      document.getElementById('photo-file-btn').style.display = '';
      setStatus('photo-status', 'Camera access denied — upload a photo instead.');
      return;
    }
    photoStream = stream;
    wrap.classList.add('active');
    setStatus('photo-status', '');
  });
}

function capturePhoto() {
  const video = document.getElementById('photo-video');
  if (!video.srcObject) return;

  const canvas = document.createElement('canvas');
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    photoBlob = blob;
    // Stop the live stream and show preview
    stopStream(photoStream); photoStream = null;
    document.getElementById('photo-camera-wrap').classList.remove('active');
    const preview = document.getElementById('photo-preview');
    preview.src = URL.createObjectURL(blob);
    preview.style.display = 'block';
    identifyPhoto();
  }, 'image/jpeg', 0.92);
}

// Fallback: file input photo
function handlePhotoSelected(input) {
  const file = input.files[0];
  if (!file) return;
  photoBlob = file;
  const preview = document.getElementById('photo-preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  identifyPhoto();
}

async function identifyPhoto() {
  if (!photoBlob) return;
  setStatus('photo-status', '<span class="spinner"></span> Identifying record…');

  const formData = new FormData();
  formData.append('photo', photoBlob, 'capture.jpg');

  try {
    const resp = await fetch('/api/photo/identify', { method: 'POST', body: formData });
    const data = await resp.json();

    if (!resp.ok) {
      setStatus('photo-status', data.error || 'Identification failed. Try a clearer photo.');
      return;
    }

    const { artist, title } = data;
    const searchQuery = [artist, title].filter(Boolean).join(' ');

    if (!searchQuery) {
      setStatus('photo-status', 'Could not identify — try a clearer photo or use SEARCH mode.');
      return;
    }

    setStatus('photo-status', `<span class="spinner"></span> Found “${esc(searchQuery)}” — searching Discogs…`);

    const sResp = await fetch('/api/discogs/search?q=' + encodeURIComponent(searchQuery));
    const sData = await sResp.json();

    if (sResp.status === 429) { setStatus('photo-status', 'Discogs rate limit — wait a minute and try again.'); return; }
    if (!sData.results?.length) {
      setStatus('photo-status', 'No Discogs results — form pre-filled with extracted info.');
      clearAddForm();
      document.getElementById('f-artist').value = artist || '';
      document.getElementById('f-title').value  = title  || '';
      document.getElementById('discogs-results').style.display = 'none';
      document.getElementById('add-form-wrap').style.display   = '';
      return;
    }
    setStatus('photo-status', '');
    showResults(sData.results, 'fillAndSaveFromRelease');
  } catch (e) {
    setStatus('photo-status', 'Error — check network connection.');
  }
}

// ── Discogs name search ────────────────────────────────────────────────
async function runDiscogsSearch() {
  const q = document.getElementById('discogs-search-input').value.trim();
  if (!q) return;

  setStatus('discogs-status', '<span class="spinner"></span> Searching…');
  document.getElementById('discogs-results').style.display = 'none';
  document.getElementById('add-form-wrap').style.display   = 'none';

  try {
    const resp = await fetch('/api/discogs/search?q=' + encodeURIComponent(q));
    const data = await resp.json();

    if (resp.status === 429) {
      setStatus('discogs-status', 'Discogs rate limit — wait a minute and try again.');
      return;
    }
    if (!data.results || !data.results.length) {
      setStatus('discogs-status', 'No results — check spelling or try MANUAL entry.');
      return;
    }
    setStatus('discogs-status', '');
    showResults(data.results);
  } catch (e) {
    setStatus('discogs-status', 'Network error — check connection.');
  }
}

// ── Discogs results picker ─────────────────────────────────────────────
function showResults(results, onPick = 'fillFromRelease') {
  const el = document.getElementById('discogs-results-inner');
  el.innerHTML = results.map(r => `
    <div class="result-item" onclick="${onPick}(${r.discogs_id})">
      ${r.thumb
        ? `<img class="result-thumb" src="${esc(r.thumb)}" alt="" onerror="this.style.display='none'">`
        : `<div class="result-thumb" style="background:var(--border)"></div>`}
      <div class="result-info">
        <div class="result-title">${esc(r.title)}</div>
        <div class="result-artist">${esc(r.artist)}</div>
        <div class="result-meta">${[r.year, r.format, r.label].filter(Boolean).join(' · ')}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('discogs-results').style.display = '';
}

async function fillAndSaveFromRelease(releaseId) {
  const statusEl = scanMode === 'scan' ? 'scan-status' : 'photo-status';
  setStatus(statusEl, '<span class="spinner"></span> Saving…');
  document.getElementById('discogs-results').style.display = 'none';

  try {
    const resp = await fetch('/api/discogs/release/' + releaseId);
    const data = await resp.json();
    if (!resp.ok) { setStatus(statusEl, data.error || 'Could not load release.'); return; }

    const payload = {
      artist:         data.artist         || '',
      title:          data.title          || '',
      year:           data.year           || null,
      format:         data.format         || '',
      label:          data.label          || '',
      catalog_number: data.catalog_number || '',
      genres:         data.genres         || '',
      average_sell_price: data.average_sell_price ?? null,
      cover_url:      data.cover_url      || '',
      discogs_id:     data.discogs_id     || null,
    };

    const artist = payload.artist.trim();
    const title = payload.title.trim();
    if (!artist || !title) {
      setStatus(statusEl, 'Could not save: Discogs release is missing artist or title.');
      showToast('Artist and title are required before saving', 'error');
      return;
    }
    payload.artist = artist;
    payload.title = title;

    const saveResp = await fetch('/api/records', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify(payload),
    });
    if (!saveResp.ok) {
      const errMsg = await getApiErrorMessage(saveResp, 'Save failed');
      if (saveResp.status === 403) {
        setStatus(statusEl, 'Save failed: owner access required. Re-enter PIN and try again.');
      } else {
        setStatus(statusEl, `Save failed: ${esc(errMsg)}`);
      }
      showToast(`Save failed: ${errMsg}`, 'error');
      return;
    }

    showToast(`Saved: ${artist} — ${title}`);
    setStatus(statusEl, '');
    if (scanMode === 'photo') {
      document.getElementById('photo-preview').style.display = 'none';
      photoBlob = null;
      startPhotoCamera();
    }
    loadRecords();
  } catch (e) {
    setStatus(statusEl, 'Network error — could not save.');
  }
}

async function fillFromRelease(releaseId) {
  document.getElementById('discogs-results').style.display = 'none';
  document.getElementById('add-form-wrap').style.display   = 'none';

  // Show loading in whichever status area is visible
  const statusEl = scanMode === 'scan' ? 'scan-status'
                 : scanMode === 'photo' ? 'photo-status'
                 : 'discogs-status';
  setStatus(statusEl, '<span class="spinner"></span> Loading release details…');

  try {
    const resp = await fetch('/api/discogs/release/' + releaseId);
    const data = await resp.json();

    if (!resp.ok) {
      setStatus(statusEl, data.error || 'Could not load release details.');
      return;
    }
    setStatus(statusEl, '');
    clearAddForm();
    document.getElementById('f-artist').value     = data.artist         || '';
    document.getElementById('f-title').value      = data.title          || '';
    document.getElementById('f-year').value       = data.year           || '';
    document.getElementById('f-format').value     = data.format         || '';
    document.getElementById('f-label').value      = data.label          || '';
    document.getElementById('f-catalog').value    = data.catalog_number || '';
    document.getElementById('f-genres').value     = data.genres         || '';
    document.getElementById('f-average-sell-price').value = data.average_sell_price != null ? data.average_sell_price : '';
    document.getElementById('f-cover-url').value  = data.cover_url      || '';
    document.getElementById('f-discogs-id').value = data.discogs_id     || '';
    document.getElementById('add-form-wrap').style.display = '';
    document.getElementById('f-artist').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) {
    setStatus(statusEl, 'Network error loading release.');
  }
}

// ── Save new record ────────────────────────────────────────────────────
async function saveRecord() {
  const artist = document.getElementById('f-artist').value.trim();
  const title  = document.getElementById('f-title').value.trim();

  document.getElementById('f-artist').classList.toggle('error', !artist);
  document.getElementById('f-title').classList.toggle('error',  !title);
  if (!artist || !title) { showToast('Artist and title are required', 'error'); return; }

  const payload = {
    artist,
    title,
    year:           parseIntOrNull(document.getElementById('f-year').value),
    format:         document.getElementById('f-format').value,
    label:          document.getElementById('f-label').value.trim(),
    catalog_number: document.getElementById('f-catalog').value.trim(),
    genres:         document.getElementById('f-genres').value.trim(),
    purchase_price: parseFloatOrNull(document.getElementById('f-purchase-price').value),
    market_value:   parseFloatOrNull(document.getElementById('f-market-value').value),
    average_sell_price: parseFloatOrNull(document.getElementById('f-average-sell-price').value),
    cover_url:      document.getElementById('f-cover-url').value.trim(),
    discogs_id:     parseIntOrNull(document.getElementById('f-discogs-id').value),
  };

  try {
    const resp = await fetch('/api/records', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error(await getApiErrorMessage(resp, 'Save failed'));
    showToast(`Saved: ${artist} — ${title}`);
    clearAddForm();
    document.getElementById('discogs-results').style.display  = 'none';
    document.getElementById('add-form-wrap').style.display    = 'none';
    loadRecords();
  } catch (e) {
    showToast(e.message || 'Save failed', 'error');
  }
}

function clearAddForm() {
  ['f-artist','f-title','f-year','f-label','f-catalog','f-genres','f-cover-url'].forEach(id => {
    document.getElementById(id).value = '';
    document.getElementById(id).classList.remove('error');
  });
  document.getElementById('f-format').value         = '';
  document.getElementById('f-purchase-price').value = '';
  document.getElementById('f-market-value').value   = '';
  document.getElementById('f-average-sell-price').value = '';
  document.getElementById('f-discogs-id').value     = '';
}

// ── Helpers ────────────────────────────────────────────────────────────
function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatCurrency(n) {
  return Number(n).toFixed(2);
}

function parseIntOrNull(v) {
  const n = parseInt(v, 10);
  return isNaN(n) ? null : n;
}

function parseFloatOrNull(v) {
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

async function getApiErrorMessage(resp, fallback = 'Request failed') {
  const errData = await resp.json().catch(() => ({}));
  if (errData && typeof errData.error === 'string' && errData.error.trim()) {
    return errData.error.trim();
  }
  return fallback;
}

function setStatus(id, html) {
  const el = document.getElementById(id);
  el.innerHTML = html;
  el.style.display = html ? '' : 'none';
}

let _toastTimer;
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = type === 'error' ? 'error' : '';
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// Enter key for search inputs
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id === 'discogs-search-input') runDiscogsSearch();
});
</script>
